name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gamerate
          POSTGRES_USER: gamerate
          POSTGRES_PASSWORD: gamerate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamerate -d gamerate"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Verify migrations on empty PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://gamerate:gamerate@127.0.0.1:5432/gamerate
        run: alembic upgrade head && alembic check
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
