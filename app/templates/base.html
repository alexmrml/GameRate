<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand-lockup" href="/games">
          <span class="brand">{{ app_name }}</span>
          <span class="brand-note">игровая аналитика</span>
        </a>
        <nav aria-label="Основная навигация">
          <a href="/games" {% if request.url.path.startswith('/games') %}aria-current="page"{% endif %}>Каталог</a>
          <a href="/activity" {% if request.url.path.startswith('/activity') %}aria-current="page"{% endif %}>Обработка</a>
          <a href="/settings" {% if request.url.path.startswith('/settings') %}aria-current="page"{% endif %}>Настройки</a>
        </nav>
        <div class="account">
          <span class="account-name">{{ current_user.username }}</span>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="button button-quiet button-small" type="submit">Выйти</button>
          </form>
        </div>
      </div>
    </header>
    <main class="shell page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
