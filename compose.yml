services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamerate}
      POSTGRES_USER: ${POSTGRES_USER:-gamerate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamerate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &app-environment
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Istanbul}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gamerate}:${POSTGRES_PASSWORD:-gamerate}@db:5432/${POSTGRES_DB:-gamerate}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-30}
      RUN_STALE_SECONDS: ${RUN_STALE_SECONDS:-900}
      SCHEDULE_INTERVAL_MINUTES: ${SCHEDULE_INTERVAL_MINUTES:-60}
      CRAWL_BATCH_SIZE: ${CRAWL_BATCH_SIZE:-20}
      CRAWL_REQUEST_DELAY_SECONDS: ${CRAWL_REQUEST_DELAY_SECONDS:-0.6}
      CRAWL_CRITIC_REVIEW_PAGES: ${CRAWL_CRITIC_REVIEW_PAGES:-2}
      CRAWL_USER_REVIEWS_PER_PLATFORM: ${CRAWL_USER_REVIEWS_PER_PLATFORM:-25}
      CRAWL_MAX_PLATFORMS: ${CRAWL_MAX_PLATFORMS:-8}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      WORKER_ID: ${WORKER_ID:-worker-1}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

