g is, thus, a prime candidate to become the 2022 GOTY.\r\n","https://areajugones.sport.es/videojuegos/analisis-elden-ring-la-mesa-redonda-tiene-nuevo-rey-arturo/","2022-02-23","","Areajugones","areajugones",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":522,"platform":523,"gameTaxonomy":525},"games","/game/elden-ring/",{"url":481,"score":384},{"id":524,"name":381},1500000062,{"game":526,"platform":527},{"id":482,"name":377},{"id":524,"name":381},{"quote":529,"score":7,"url":530,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":531,"publicationSlug":532,"reviewedProduct":533,"platform":381},"Elden Ring is a crowning achievement of over a decade of Miyazaki\u2019s and FromSoftware\u2019s work, and an amazing example of how to find a whole new level of fun in a well-known and somewhat worn-out formula. The open world turned out to be a perfect fit for the genre and you can still tell this masterpiece was created by the famous Japanese studio. I honestly haven\u2019t been so excited about a game since the first Dark Souls.","https://cdaction.pl/recenzje/recenzja-elden-ring-to-nie-jest-dark-souls-iv-to-cos-znacznie-wiecej","CD-Action","cd-action",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":534,"platform":535,"gameTaxonomy":536},{"url":481,"score":384},{"id":524,"name":381},{"game":537,"platform":538},{"id":482,"name":377},{"id":524,"name":381},{"quote":540,"score":7,"url":541,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":542,"publicationSlug":543,"reviewedProduct":544,"platform":381},"An uncompromising vision of wonder and terror, Elden Ring is the ultimate dark fantasy odyssey.","https://culturedvultures.com/elden-ring-ps5-review/","Cultured Vultures","cultured-vultures",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":545,"platform":546,"gameTaxonomy":547},{"url":481,"score":384},{"id":524,"name":381},{"game":548,"platform":549},{"id":482,"name":377},{"id":524,"name":381},{"quote":551,"score":7,"url":552,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":553,"publicationSlug":554,"reviewedProduct":555,"platform":381},"As an experience, it's one of the most wondrous and open-ended games I've played in years.","https://www.destructoid.com/reviews/review-elden-ring/","Destructoid","destructoid",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":556,"platform":557,"gameTaxonomy":558},{"url":481,"score":384},{"id":524,"name":381},{"game":559,"platform":560},{"id":482,"name":377},{"id":524,"name":381},{"quote":562,"score":7,"url":563,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":564,"publicationSlug":565,"reviewedProduct":566,"platform":381},"Elden Ring is a tour de force and is maybe the only example of a studio underselling a title. It's an M-rated Breath of the Wild, full of secrets, intrigue, and an enthralling world to explore. It's a game that makes me excited about gaming, and it's fantastic to see a highly anticipated title like this turn out so well. ","https://www.gamerevolution.com/review/702562-elden-ring-review-worth-buying-playing-ps4-ps5-pc-xbox-one-series-x-s","Game Revolution","game-revolution",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":567,"platform":568,"gameTaxonomy":569},{"url":481,"score":384},{"id":524,"name":381},{"game":570,"platform":571},{"id":482,"name":377},{"id":524,"name":381},{"quote":573,"score":7,"url":574,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":575,"publicationSlug":576,"reviewedProduct":577,"platform":381},"Elden Ring is the true triumph that FromSoftware was striving for all those years. Complete and utter triumph.","https://gamemag.ru/reviews/elden-ring-review-ps5","GameMAG","gamemag",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":578,"platform":579,"gameTaxonomy":580},{"url":481,"score":384},{"id":524,"name":381},{"game":581,"platform":582},{"id":482,"name":377},{"id":524,"name":381},{"quote":584,"score":7,"url":585,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":586,"publicationSlug":587,"reviewedProduct":588,"platform":381},"Elden Ring is the culmination of everything Dark Souls brought before it, mixed with a fresh take on the open world genre that leaves no hand held with minimal boring sequences or clogged quest logs. Despite a few growing pains and the real fun beginning a few hours in, Elden Ring is what every game in its genre should strive to be; a challenging, mysterious adventure that never ceases to amaze, only getting better the more time you spend in its dark, yet absolutely beautiful world.","https://www.gamer.no/artikler/slik-ser-et-mesterverk-ut/514614","Gamer.no","gamerno",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":589,"platform":590,"gameTaxonomy":591},{"url":481,"score":384},{"id":524,"name":381},{"game":592,"platform":593},{"id":482,"name":377},{"id":524,"name":381},{"quote":595,"score":7,"url":596,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":597,"publicationSlug":598,"reviewedProduct":599,"platform":381},"I'm joyfully exploring every inch of the land and delighting in my discoveries, and I don't see myself stopping any time soon.\r\n","https://venturebeat.com/2022/02/23/elden-ring-is-a-brilliant-monument-to-fromsoftwares-legacy/","GamesBeat","gamesbeat",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":600,"platform":601,"gameTaxonomy":602},{"url":481,"score":384},{"id":524,"name":381},{"game":603,"platform":604},{"id":482,"name":377},{"id":524,"name":381},{"quote":606,"score":7,"url":607,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":608,"publicationSlug":609,"reviewedProduct":610,"platform":381},"Elden Ring is an exceptional, accomplished work that realises a fantasy world of solemnity, beauty, and menacing uncertainty you can\u2019t help but lose yourself in.","https://www.gameshub.com/news/reviews/elden-ring-review-ps5-13634/","GamesHub","gameshub",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":611,"platform":612,"gameTaxonomy":613},{"url":481,"score":384},{"id":524,"name":381},{"game":614,"platform":615},{"id":482,"name":377},{"id":524,"name":381},{"quote":617,"score":7,"url":618,"date":515,"author":516,"authorSlug":14,"image":14,"publicationName":619,"publicationSlug":620,"reviewedProduct":621,"platform":381},"Combining the deep and challenging combat FromSoftware is known for with a vast and varied world that's always a pleasure to explore, Elden Ring is quite simply incredible. From the moment you step foot into The Lands Between you'll be engrossed, and while you'll no doubt experience some setbacks on your adventure \u2013 such as a boss that at first seems impossible to defeat \u2013 there's always somewhere else to go to cool off, pick yourself up, and perhaps power yourself up before returning to have another go. That is to say, you don't just play Elden Ring; you live in its world for hours at a time. It will consume you, but you'll willingly throw yourself into its maw with fervour.","https://www.gamespew.com/2022/02/elden-ring-review/","GameSpew","gamespew",{"id":482,"type":520,"title":377,"url":521,"criticScoreSummary":622,"platform":623,"gameTaxonomy":624},{"url":481,"score":384},{"id":524,"name":381},{"game":625,"platform":626},{"id":482,"name":377},{"id":524,"name":381},{"self":628,"prev":630,"next":631,"first":633,"last":634,"filterOptions":636,"sortOptions":652},{"href":629},"https://backend.metacritic.com/reviews/metacritic/critic/games/elden-ring/web?offset=0&limit=10&filterBySentiment=all&sort=score&componentName=critic-reviews&componentDisplayName=critic+Reviews&componentType=ReviewList",{"href":14},{"href":632},"https://backend.metacritic.com/reviews/metacritic/critic/games/elden-ring/web?offset=10&limit=10&filterBySentiment=all&sort=score&componentName=critic-reviews&componentDisplayName=critic+Reviews&componentType=ReviewList",{"href":629},{
