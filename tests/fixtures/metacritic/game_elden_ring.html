me of the game's colossal bosses, or force your way into the games of skilled players and challenge them to PvP battle.  Leave hints and clues for those who will follow in your footsteps; either intentionally or through your own inadvertent demise, your bloodstains will allow your successors to view a replay of your death, hinting at how to avoid your gruesome fate. [Atlus USA]",{"videoClosestPastAvailableDate":22,"videoClosestFutureAvailableDate":22,"videoClosestPastExpiryDate":22,"videoClosestFutureExpiryDate":22,"videoClosestPastAvailableNetworkId":22,"videoClosestFutureAvailableNetworkId":22,"videoClosestPastExpiryNetworkId":22,"videoClosestFutureExpiryNetworkId":22,"networkStreamingDates":22},{"score":670},{"id":963,"type":383,"typeId":384,"title":964,"slug":965,"premiereYear":966,"releaseDate":967,"rating":443,"seoUrl":22,"image":968,"criticScoreSummary":972,"genres":974,"numberOfSeasons":6,"network":22,"description":976,"duration":6,"streamingDates":977,"userScore":978},1300024003,"Fable II","fable-ii",2008,"2008-10-21",{"id":22,"filename":969,"dateCreated":970,"alt":22,"credits":22,"path":22,"cropGravity":22,"crop":22,"caption":22,"typeName":22,"imageUrl":22,"width":597,"height":13,"sType":22,"bucketType":418,"bucketPath":971,"mediaType":22,"provider":22},"6-1-66966-52.jpg",{"date":22,"timezone":22},"/provider/6/12/6-1-66966-52.jpg",{"url":973,"max":9,"score":859,"reviewCount":537,"positiveCount":394,"neutralCount":11,"negativeCount":6,"sentiment":879},"/game/fable-ii/critic-reviews/",[975],{"id":22,"name":442},"Set 500 years after the original, Fable II provides gamers with an epic story and innovative real-time gameplay, including a massive amount of freedom and choice to explore a vast collection of dungeons, catacombs and caves in the world of Albion. Fable II expands upon the scope and depth of the Xbox classic by adding incredible new features and creating a wider, more complex kingdom of limitless choices and consequences. Players have the option to play as a man or woman, get married, have children, and live a life of their own design. Revisit the sprawling world of Albion more than 500 years after the events of the original Fable, where you are free to explore the landscape and openly roam the countryside. For the right price every house, hut, dungeon and castle is for sale. Players can witness how the world grows and changes in response to their decisions in incredible and unique ways as they rediscover Albion as if for the first time. Fable II pioneers a new combat system designed to allow players to truly master hand weapons such as swords and maces, ranged combat weapons such as cross-bows and guns, and an entirely new magic system. These three disciplines, while very accessible, are also amazingly deep, and allow players to mix combat styles and become everything from master swordsman to skilled ranger to evil magic welder, utilizing a single button on the Xbox 360 controller. [Lionhead]",{"videoClosestPastAvailableDate":22,"videoClosestFutureAvailableDate":22,"videoClosestPastExpiryDate":22,"videoClosestFutureExpiryDate":22,"videoClosestPastAvailableNetworkId":22,"videoClosestFutureAvailableNetworkId":22,"videoClosestPastExpiryNetworkId":22,"videoClosestFutureExpiryNetworkId":22,"networkStreamingDates":22},{"score":979},7.9,{"self":981,"prev":985,"next":986,"first":989,"last":991,"tabs":995},{"href":982,"meta":983},"https://backend.metacritic.com/finder/metacritic/web?sortBy=-metaScore&mcoTypeId=13&genres=Action+RPG&offset=0&limit=24&componentName=related-carousel&componentDisplayName=Related+Carousel&componentType=ProductList",{"pageNum":19,"count":984},24,{"href":22,"meta":22},{"href":987,"meta":988},"https://backend.metacritic.com/finder/metacritic/web?sortBy=-metaScore&mcoTypeId=13&genres=Action+RPG&offset=24&limit=24&componentName=related-carousel&componentDisplayName=Related+Carousel&componentType=ProductList",{"pageNum":11,"count":984},{"href":982,"meta":990},{"pageNum":19,"count":984},{"href":992,"meta":993},"https://backend.metacritic.com/finder/metacritic/web?sortBy=-metaScore&mcoTypeId=13&genres=Action+RPG&offset=720&limit=24&componentName=related-carousel&componentDisplayName=Related+Carousel&componentType=ProductList",{"pageNum":994,"count":19},31,[996,999,1001],{"label":997,"href":998},"New Releases","https://backend.metacritic.com/finder/metacritic/web?sortBy=-releaseDate&mcoTypeId=13&genres=Action+RPG&offset=0&limit=24&componentName=related-carousel&componentDisplayName=Related+Carousel&componentType=ProductList",{"label":1000,"href":982},"Top Critics' Picks",{"label":1002,"href":1003},"Most Popular","https://backend.metacritic.com/finder/metacritic/web?sortBy=-popularityCount&mcoTypeId=13&genres=Action+RPG&offset=0&limit=24&componentName=related-carousel&componentDisplayName=Related+Carousel&componentType=ProductList",{"componentName":1005,"componentDisplayName":1006,"componentType":1007},"related-carousel","Related Carousel","ProductList","Elden Ring is simply a game that the player naturally adapts to their own style of play. Challenging at times, vicious at others, but mostly incredibly fun. The enjoyable pace makes the hours of play pass by like water, and each path opens up a few more, only to come together again after a fair amount of exploration before the next big reveal. [Issue#318]","2024-01-30","LEVEL (Czech Republic)","level-czech-republic","games","/game/elden-ring/",1500000062,"All Reviews","Positive Reviews","Mixed Reviews","Negative Reviews","1400627895",6588,"ed4e5b95-ed52-4c2c-8923-9a840ca9e5af","Simply one of the best game ever created, once you understand that is a souls game and you need to learn pattern etc you really enjoyed it. The open world is massive and beautiful with a lot of secret","2026-08-19","Toshikage",1787160453558,"91fec3b0-b2e4-470e-82cf-051ae2054a83","The absolute pinnacle of open worlds ever crafted in the medium. Everything from the castles, to the huge empty landscapes, to the immaculate combat, to the dark dungeons and caves, to the cinematic and beautiful boss fights, to the story, intertwines and comes together to make an experience on one of the highest levels we\u2019ve ever seen in fiction","2026-08-15","fleis-on-fire69",1786814299691,"fc65902e-471b-49a5-880d-b0a823ab1ca3","Para mi es de los mejores juegos que an salido en la historia el mundo,el lore, los jefes en general una obra maestra.","2026-03-15","Rickee079",1786534928217,{"data":1037,"links":1039,"meta":1042},{"item":1038},{"id":22,"max":9,"score":392,"reviewCount":395,"positiveCount":395,"neutralCount":6,"negativeCount":6,"sentiment":396,"url":489},{"self":1040},{"href":1041},"https://backend.metacritic.com/reviews/metacritic/critic/games/elden-ring/stats/web?componentName=critic-score-summary&componentDisplayName=Critic+Score+Summary&componentType=MetaScoreSummary",{"componentName":1043,"componentDisplayName":1044,"componentType":1045},"critic-score-summary","Critic Score Summary","MetaScoreSummary",{"data":1047,"links":1207,"meta":1215},{"id":490,"totalResults":394,"item":1048},{"default":1049,"positive":1126,"negative":1205,"neutral":1206},[1050,1057,1069,1081,1093,1104,1115],{"quote":1008,"score":9,"url":507,"date":1009,"author":507,"authorSlug":22,"image":22,"publicationName":1010,"publicationSlug":1011,"reviewedProduct":1051,"platform":389},{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1052,"platform":1053,"gameTaxonomy":1054},{"url":489,"score":392},{"id":1014,"name":389},{"game":1055,"platform":1056},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1058,"score":9,"url":1059,"date":1060,"author":507,"authorSlug":22,"image":22,"publicationName":1061,"publicationSlug":1062,"reviewedProduct":1063,"platform":389},"Elden Ring is a superlative title, one of those works capable of becoming an event and becoming engraved in the collective imagination. It achieves this by remaining faithful to its formula and exporting its identity to the concept of the open world, achieving its own personal approach, resulting in a world that is visually stunning, and that works with overwhelming precision in terms of mechanics. An excellent videogame that also maintains the concreteness of its proposal.","https://es.ign.com/elden-ring/179924/review/analisis-de-elden-ring-la-formula-souls-y-el-mundo-abierto-se-dan-la-mano-para-alcanzar-la-excelenci ","2022-02-28","IGN Spain","ign-spain",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1064,"platform":1065,"gameTaxonomy":1066},{"url":489,"score":392},{"id":1014,"name":389},{"game":1067,"platform":1068},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1070,"score":9,"url":1071,"date":1072,"author":507,"authorSlug":22,"image":22,"publicationName":1073,"publicationSlug":1074,"reviewedProduct":1075,"platform":389},"Elden Ring packs its intricately crafted world - a world which should be used as a reference point for open-world design moving forward - with more impressive boss fights and secrets than you can shake a giant greatsword at. Although its punishing combat system may not be to everyone\u2019s taste, it is an essential experience both for FromSoftware newcomers and seasoned veterans alike.","https://www.theloadout.com/elden-ring/review-ps5","2022-03-02","The Loadout","the-loadout",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1076,"platform":1077,"gameTaxonomy":1078},{"url":489,"score":392},{"id":1014,"name":389},{"game":1079,"platform":1080},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1082,"score":9,"url":1083,"date":1084,"author":507,"authorSlug":22,"image":22,"publicationName":1085,"publicationSlug":1086,"reviewedProduct":1087,"platform":389},"Elden Ring is a crowning achievement of over a decade of Miyazaki\u2019s and FromSoftware\u2019s work, and an amazing example of how to find a whole new level of fun in a well-known and somewhat worn-out formula. The open world turned out to be a perfect fit for the genre and you can still tell this masterpiece was created by the famous Japanese studio. I honestly haven\u2019t been so excited about a game since the first Dark Souls.","https://cdaction.pl/recenzje/recenzja-elden-ring-to-nie-jest-dark-souls-iv-to-cos-znacznie-wiecej","2022-02-23","CD-Action","cd-action",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1088,"platform":1089,"gameTaxonomy":1090},{"url":489,"score":392},{"id":1014,"name":389},{"game":1091,"platform":1092},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1094,"score":537,"url":1095,"date":1084,"author":507,"authorSlug":22,"image":22,"publicationName":1096,"publicationSlug":1097,"reviewedProduct":1098,"platform":389},"Elden Ring feels like the natural evolution of a video game series that continues to reinvent itself after more than 13 years of its birth. FromSoftware is simply the best at what they do. While there are some technical issues and repetitive structures and creatures, Elden Ring is a cruelly wonderful piece of work and one of the best adventure games of recent years.","https://malditosnerds.com/elden-ring/analisis-elden-ring-el-soulslike-llega-al-mundo-abierto-n19795","Malditos Nerds","malditos-nerds",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1099,"platform":1100,"gameTaxonomy":1101},{"url":489,"score":392},{"id":1014,"name":389},{"game":1102,"platform":1103},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1105,"score":7,"url":1106,"date":1084,"author":507,"authorSlug":22,"image":22,"publicationName":1107,"publicationSlug":1108,"reviewedProduct":1109,"platform":389},"The years of waiting were worth it, Elden Ring is brilliant. It offers a huge amount of content, a beautiful world and addictive gameplay. But the series does start to feel a little bit stale.","https://games.tiscali.cz/recenze/elden-ring-recenze-nejambicioznejsi-souls-hry-529377","Games.cz","gamescz",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1110,"platform":1111,"gameTaxonomy":1112},{"url":489,"score":392},{"id":1014,"name":389},{"game":1113,"platform":1114},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1116,"score":722,"url":507,"date":1117,"author":507,"authorSlug":22,"image":22,"publicationName":1118,"publicationSlug":1119,"reviewedProduct":1120,"platform":389},"Elden Ring needed to be fresh and bold, and \r\nit succeeds, putting you in charge of your\r\nown adventure. However the open world has \r\nsome uneven terrain. [Issue#12, p.80]","2022-03-07","PLAY","play",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1121,"platform":1122,"gameTaxonomy":1123},{"url":489,"score":392},{"id":1014,"name":389},{"game":1124,"platform":1125},{"id":490,"name":385},{"id":1014,"name":389},[1127,1134,1146,1158,1170,1181,1193],{"quote":1008,"score":9,"url":507,"date":1009,"author":507,"authorSlug":22,"image":22,"publicationName":1010,"publicationSlug":1011,"reviewedProduct":1128,"platform":389},{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1129,"platform":1130,"gameTaxonomy":1131},{"url":489,"score":392},{"id":1014,"name":389},{"game":1132,"platform":1133},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1135,"score":9,"url":1136,"date":1137,"author":507,"authorSlug":22,"image":22,"publicationName":1138,"publicationSlug":1139,"reviewedProduct":1140,"platform":389},"Elden Ring is FromSoftware taming the monster they created, not by filing down its teeth and claws, but by giving players the weapons and armor to endure it.","https://www.slantmagazine.com/games/elden-ring-review/","2022-05-25","Slant Magazine","slant-magazine",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1141,"platform":1142,"gameTaxonomy":1143},{"url":489,"score":392},{"id":1014,"name":389},{"game":1144,"platform":1145},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1147,"score":9,"url":1148,"date":1149,"author":507,"authorSlug":22,"image":22,"publicationName":1150,"publicationSlug":1151,"reviewedProduct":1152,"platform":389},"Elden Ring is a stunning achievement from a literal video game architecture perspective, along with creating a difficult but not wildly punishing game that everyone, even non-Soulsborne devotees, should be able to enjoy. I have not been this impressed with an open world since Skyrim, and Elden Ring even surpasses that in many ways. It\u2019s an easy game to recommend to anyone and everyone, and deserves the explosive sales success we\u2019ve seen, dwarfing old FromSoft records. Elden Ring is a gaming achievement the likes of which we rarely seen, and you will be remiss to not pick it up and see what the hype is about for yourself. ","https://www.forbes.com/sites/paultassi/2022/05/12/elden-ring-review-ps5-game-of-the-generation-so-far/","2022-05-13","Forbes","forbes",{"id":490,"type":1012,"title":385,"url":1013,"criticScoreSummary":1153,"platform":1154,"gameTaxonomy":1155},{"url":489,"score":392},{"id":1014,"name":389},{"game":1156,"platform":1157},{"id":490,"name":385},{"id":1014,"name":389},{"quote":1159,"score":9,"url":1160,"date":1161,"author":507,"authorSlug":22,"image":22,"publicationName":1162,"publicationSlug":1163,"reviewedProduct":1164,"platform":389},"More than anything, we must always stress that, yes, the Lands Between \u2014 the open world, therefore \u2014 is the main highlight. In an era taken by mediocre open-world games, it's refreshing to see that a company new to this concept got it so precisely right. There's no doubt about it: this is, indeed, one of the best games of recent years. If you're a fan of Open Worlds, no matter what level of challenge you're used to, give it a go. The chances of regret are almost zero. We often think of FromSoftware games in extreme ways. I love it. I hate it. It's amazing. It's unbearable. Elden Ring does bump into these dualities, but tends to be much more attractive to the public in general.","https://www.theenemy.com.br/social/criticas/review-elden-ring","2022-04-18","The Enemy","the-enemy",{"id":490,"type":1012,"t :382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1301,"quote":1302,"score":14,"thumbsUp":22,"thumbsDown":22,"date":1303,"author":1304,"version":1305,"spoiler":17,"reviewedProduct":1399,"platform":389},{"id":490,"type":1012,"title":385,"url":1013,"platform":1400,"gameTaxonomy":1401},{"id":487,"name":389},{"family":1402,"title":1403,"game":1404,"platform":1405},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1407,"quote":1408,"score":14,"thumbsUp":22,"thumbsDown":22,"date":1354,"author":1409,"version":1410,"spoiler":17,"reviewedProduct":1411,"platform":389},"6534a7b0-0e79-4566-b79c-d21980cde7f0","The game is graphically gorgeous. I often found myself traversing the world just to see what was around the bend. That's kind of where my enjoyment ended though. I wasn't allowed to delight in leveling up, defeating bosses, or creating a great character build. **** game is far too punishing. The enemies in between destinations are spread out enough to be fun and challenging, and if you die, we'll it is easy enough to get back there to collect your dropped runes. But if you die in a location such as ruins, fortress or a cave/dungeon, the enemies are often overwhelming enough to take you down. Then you have to make it all the way back to where you bit the dust tore claim you dropped runes. Yes, you gotta walk back into the same hell hole that killed you **** what you lost the first time and it often kills you again causing you to lose your hard earned runes permanently. The controls are sluggish and the camera often is not dynamic enough to help you see your way out of trouble. The final nail in the coffin is the story, or lack thereof. There is not enough of it to grasp on to and make me understand why Im doing what Im doing, wandering around the vast, beautiful open world, or even really care. Your character is bland,the circumstances vague, and you wander aimlessly.\n\nThere are those this game was meant for. I was not one of them.","matthall3791",1749364681252,{"id":490,"type":1012,"title":385,"url":1013,"platform":1412,"gameTaxonomy":1413},{"id":487,"name":389},{"family":1414,"title":1415,"game":1416,"platform":1417},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1419,"quote":1420,"score":14,"thumbsUp":22,"thumbsDown":22,"date":1421,"author":1422,"version":1423,"spoiler":17,"reviewedProduct":1424,"platform":389},"e1ca4bea-ad2c-45e9-9895-a59c16048b0c","They should've gotten the actual FromSoftware to make this game. Cause no way did the people who made the bosses in DS3 and Bloodborne make the pieces of **** in this one.","2025-06-06","Zeeboomer02",1749171498345,{"id":490,"type":1012,"title":385,"url":1013,"platform":1425,"gameTaxonomy":1426},{"id":487,"name":389},{"family":1427,"title":1428,"game":1429,"platform":1430},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1432,"quote":1433,"score":14,"thumbsUp":22,"thumbsDown":22,"date":1434,"author":1435,"version":1436,"spoiler":17,"reviewedProduct":1437,"platform":389},"6a6f8e3a-4130-4577-ba5a-9af94b08e10d","It's great and it ****. Inconsistent difficulty is the biggest problem. Some areas are a blast - a challenge and lots of fun. Other areas are literally impossible to pass because of the extreme difficulty. It has a lot of content, but you'll be highly frustrated trying to experience much of it.","2025-05-14","multiwalrus",1747244350232,{"id":490,"type":1012,"title":385,"url":1013,"platform":1438,"gameTaxonomy":1439},{"id":487,"name":389},{"family":1440,"title":1441,"game":1442,"platform":1443},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1445,"quote":1446,"score":14,"thumbsUp":22,"thumbsDown":22,"date":1447,"author":1448,"version":1449,"spoiler":17,"reviewedProduct":1450,"platform":389},"96f0c91d-4102-4d39-bb1f-e0e86c7c049b","Overrated game that did so much wrong what made Dark Souls so good. Hyper aggressive bosses with endless combos and huge areas with nothing useful in it make no fun. PvP is boring in this game and no fun at all","2025-04-12","DannyDurak",1744446858298,{"id":490,"type":1012,"title":385,"url":1013,"platform":1451,"gameTaxonomy":1452},{"id":487,"name":389},{"family":1453,"title":1454,"game":1455,"platform":1456},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1458,"quote":1459,"score":14,"thumbsUp":22,"thumbsDown":22,"date":1460,"author":1461,"version":1462,"spoiler":17,"reviewedProduct":1463,"platform":389},"23b23d49-2ccb-4eb0-ad80-016ec414d875","After 156 hours I must conclude that the souls fomular doesnt work on an open world. They is so much quantity in this game without quality. Bosses like Margit, Radahn or Mogh are peak bosses but they an absolute minority. All dragon bosses are bad in Elden Ring. They are sadly all bad designed and balanced. They have cool over the top attacks but gameplay wise all the same. 90% of the bosses are reused and boring. The dodge and hit mechanic are its limit got sadly boring in the end.\nThere is no variety every weapon plays almost the same and armor is useless. Its my opinion but the passive playstyle where you always is sometimes  even frustrating and boring. The dodge timing is now so thight that its almost impossible to create fair **** the parry mechanic in Sekiro is waymore satisfying. Imagine playing against Consort Radahn or Fortissax but with parrys and mikiri counters etc. This would be mind blowing. It becomes a battle between two power houses and not just a battle where you try to avoid the battle. Another big malus is the loot. In the first area. Its fun gathering loot. But midgame the loot is 99% useless because of your build and a waste if time. So you stop looting. But the openworld has only battles, loot or mini quest (conversations). Therefore you stop exploring and start to rush the game. \nIn the end its clear that most of the good reviews are written by Soulsfanatics. At least the dlc was able to fix the mistakes of the maingame !","2025-03-21","Bigspin",1742564799884,{"id":490,"type":1012,"title":385,"url":1013,"platform":1464,"gameTaxonomy":1465},{"id":487,"name":389},{"family":1466,"title":1467,"game":1468,"platform":1469},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},[1471,1479,1487,1500,1513,1526,1539],{"id":1262,"quote":1263,"score":15,"thumbsUp":22,"thumbsDown":22,"date":1264,"author":1265,"version":1266,"spoiler":17,"reviewedProduct":1472,"platform":389},{"id":490,"type":1012,"title":385,"url":1013,"platform":1473,"gameTaxonomy":1474},{"id":487,"name":389},{"family":1475,"title":1476,"game":1477,"platform":1478},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1275,"quote":1276,"score":15,"thumbsUp":22,"thumbsDown":22,"date":1277,"author":1278,"version":1279,"spoiler":17,"reviewedProduct":1480,"platform":389},{"id":490,"type":1012,"title":385,"url":1013,"platform":1481,"gameTaxonomy":1482},{"id":487,"name":389},{"family":1483,"title":1484,"game":1485,"platform":1486},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1488,"quote":1489,"score":15,"thumbsUp":22,"thumbsDown":22,"date":1490,"author":1491,"version":1492,"spoiler":17,"reviewedProduct":1493,"platform":389},"f9b382b0-7980-4fa6-9ac6-0c2a03376ffc","Insane art direction, incredible sound design and phenomenal atmosphere. \n\nHowever, I hate how bosses and most enemies have crazy combos that never end and never give you a second to hit back. Also, I don't think a simple encounter in the wilds should feel as difficult as an endgame boss from earlier Souls games.\n\nI don't like the open-world structure. Most of your time is spent riding your horse and wasting time trying to find something to do that doesn't involve just killing everything you see.\n\nQuests are impossible to follow or complete without using the wiki. If you don't, you will either completely miss the next objective or randomly stumble on the NPC like 50 hours later and now they're dead.\n\nAnother thing. In previous Souls games, items and gear were found naturally through exploring all nooks and crannies. There doesn't seem to be as much stuff in the environment to find this time around, I'm never rewarded for going out of my way to explore, unless you count rewards from completing dungeons... which, most of the time, end up useless to you because of stats requirements. This creates a frustrating gameplay loop where you work your butt off to clear a difficult boss only to get a reward you won't even use. This happens over and over again unless you use a wiki to plan out your build and route but that defeats the whole point of exploration.\n\nFinally, I think the game takes too long to beat. I prefer the previous Souls games that are more focused and intentional. Elden Ring feels bloated.","2026-05-28","MisteurFox",1779961697807,{"id":490,"type":1012,"title":385,"url":1013,"platform":1494,"gameTaxonomy":1495},{"id":487,"name":389},{"family":1496,"title":1497,"game":1498,"platform":1499},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1501,"quote":1502,"score":15,"thumbsUp":22,"thumbsDown":22,"date":1503,"author":1504,"version":1505,"spoiler":17,"reviewedProduct":1506,"platform":389},"288159a7-6d6c-468a-b035-18e1fb29a73a","I have a love hate relationship with Elden Ring. It has some of the coolest weapons/builds in all Fromsoft history and NG+7 is actually doable and fun to play through, but that's where the positives end. Open world games are overwhelming nowadays for someone who likes to complete games. Waaaay too many copy pasted dungeons with copy pasted bosses. There's too many crannies to search and vast open areas with nothing of note. When you do find an item hidden out in the open world, 9 times out of 10 it's a leaf or a mushroom. You are not rewarded nearly enough for going down optional paths and that's a problem for a game as big as Elden Ring. The bosses are more aggressive than ever before and there needs to be a line. Bosses have these seemingly endless combos with lots of forward momentum. You'll get a VERY small window of opportunity to hit the boss like once or twice, then it's back to these ridiculously long combos. You barely get to attack, it's just roll city and if you get caught, a third or more of your HP is gone. And my last complaint is that this game is waaaaay too long for a souls game. Part of the fun of these games is that the run time is long enough to be significant but short enough to where you want to go through it again with a new weapon/build. In Elden Ring I was exhausted by the time the credits rolled and I didn't want to try out any cool new builds. Such a shame. ","2026-05-18","Ansemriku10",1779730066336,{"id":490,"type":1012,"title":385,"url":1013,"platform":1507,"gameTaxonomy":1508},{"id":487,"name":389},{"family":1509,"title":1510,"game":1511,"platform":1512},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1514,"quote":1515,"score":15,"thumbsUp":22,"thumbsDown":22,"date":1516,"author":1517,"version":1518,"spoiler":17,"reviewedProduct":1519,"platform":389},"0109fe51-b6d5-4086-88c1-1385a97f487b","Excellent mais le je ne nous donne pas envie d'explorer a cause de sa difficult\u00e9 ","2026-02-07","gami667",1774118419460,{"id":490,"type":1012,"title":385,"url":1013,"platform":1520,"gameTaxonomy":1521},{"id":487,"name":389},{"family":1522,"title":1523,"game":1524,"platform":1525},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1527,"quote":1528,"score":15,"thumbsUp":22,"thumbsDown":22,"date":1529,"author":1530,"version":1531,"spoiler":17,"reviewedProduct":1532,"platform":389},"56d7638b-3cbe-44e5-8b8e-7f0e215f4008","It\u2019s good but doesn\u2019t really deserve the high scores people are giving it. There\u2019s a lot of copy and paste in the game. Both from a level point of view and bosses. Making the same boss a different colour isn\u2019t a new boss. You fight the same ones over and over again. It\u2019s just lazy","2026-03-04","Shadow757",1772591874781,{"id":490,"type":1012,"title":385,"url":1013,"platform":1533,"gameTaxonomy":1534},{"id":487,"name":389},{"family":1535,"title":1536,"game":1537,"platform":1538},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"id":1540,"quote":1541,"score":15,"thumbsUp":22,"thumbsDown":22,"date":910,"author":1542,"version":1543,"spoiler":17,"reviewedProduct":1544,"platform":389},"f99b653c-9caa-46af-8dcb-c9a10f4b3993","Personally, I don't think the open world works - it feels unnecessary and adds a lot of padding to the game. Also, the discount chalice dungeons aren't my favourite side activity, and I don't think offers enough to be worth exploring. Furthermore, I'm not a fan of recycling bosses or just duplicating bosses to make the fight harder (lazy game design). With that being said, it's not my least favourite Soulsborne game. It's still pretty good, just not great.","Blitzbjorn",1770800208013,{"id":490,"type":1012,"title":385,"url":1013,"platform":1545,"gameTaxonomy":1546},{"id":487,"name":389},{"family":1547,"title":1548,"game":1549,"platform":1550},{"id":497,"name":385},{"id":382,"name":385},{"id":490,"name":385},{"id":487,"name":389},{"self":1552,"tabs":1554},{"href":1553},"https://backend.metacritic.com/reviews/metacritic/user/games/elden-ring/summary/web?componentName=user-reviews&componentDisplayName=User+Reviews&componentType=ProductReviewsSummary",[1555,1556,1557,1558],{"label":1015,"href":507},{"label":1016,"href":507},{"label":1017,"href":507},{"label":1018,"href":507},{"componentName":1560,"componentDisplayName":1561,"componentType":1218},"user-reviews","User Reviews",{"edition":21,"title":1563,"id":1564,"slug":386,"category":22,"description":3
