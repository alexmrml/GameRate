 in a world that is visually stunning, and that works with overwhelming precision in terms of mechanics. An excellent videogame that also maintains the concreteness of its proposal.","https://es.ign.com/elden-ring/179924/review/analisis-de-elden-ring-la-formula-souls-y-el-mundo-abierto-se-dan-la-mano-para-alcanzar-la-excelenci ","2022-02-28","IGN Spain","ign-spain",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":566,"platform":567,"gameTaxonomy":568},{"url":485,"score":388},{"id":516,"name":385},{"game":569,"platform":570},{"id":486,"name":381},{"id":516,"name":385},{"quote":572,"score":9,"url":573,"date":574,"author":503,"authorSlug":18,"image":18,"publicationName":575,"publicationSlug":576,"reviewedProduct":577,"platform":385},"Elden Ring packs its intricately crafted world - a world which should be used as a reference point for open-world design moving forward - with more impressive boss fights and secrets than you can shake a giant greatsword at. Although its punishing combat system may not be to everyone\u2019s taste, it is an essential experience both for FromSoftware newcomers and seasoned veterans alike.","https://www.theloadout.com/elden-ring/review-ps5","2022-03-02","The Loadout","the-loadout",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":578,"platform":579,"gameTaxonomy":580},{"url":485,"score":388},{"id":516,"name":385},{"game":581,"platform":582},{"id":486,"name":381},{"id":516,"name":385},{"quote":584,"score":9,"url":585,"date":586,"author":503,"authorSlug":18,"image":18,"publicationName":587,"publicationSlug":588,"reviewedProduct":589,"platform":385},"Elden Ring is a crowning achievement of over a decade of Miyazaki\u2019s and FromSoftware\u2019s work, and an amazing example of how to find a whole new level of fun in a well-known and somewhat worn-out formula. The open world turned out to be a perfect fit for the genre and you can still tell this masterpiece was created by the famous Japanese studio. I honestly haven\u2019t been so excited about a game since the first Dark Souls.","https://cdaction.pl/recenzje/recenzja-elden-ring-to-nie-jest-dark-souls-iv-to-cos-znacznie-wiecej","2022-02-23","CD-Action","cd-action",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":590,"platform":591,"gameTaxonomy":592},{"url":485,"score":388},{"id":516,"name":385},{"game":593,"platform":594},{"id":486,"name":381},{"id":516,"name":385},{"quote":596,"score":505,"url":597,"date":586,"author":503,"authorSlug":18,"image":18,"publicationName":598,"publicationSlug":599,"reviewedProduct":600,"platform":385},"Elden Ring feels like the natural evolution of a video game series that continues to reinvent itself after more than 13 years of its birth. FromSoftware is simply the best at what they do. While there are some technical issues and repetitive structures and creatures, Elden Ring is a cruelly wonderful piece of work and one of the best adventure games of recent years.","https://malditosnerds.com/elden-ring/analisis-elden-ring-el-soulslike-llega-al-mundo-abierto-n19795","Malditos Nerds","malditos-nerds",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":601,"platform":602,"gameTaxonomy":603},{"url":485,"score":388},{"id":516,"name":385},{"game":604,"platform":605},{"id":486,"name":381},{"id":516,"name":385},{"quote":607,"score":7,"url":608,"date":586,"author":503,"authorSlug":18,"image":18,"publicationName":609,"publicationSlug":610,"reviewedProduct":611,"platform":385},"The years of waiting were worth it, Elden Ring is brilliant. It offers a huge amount of content, a beautiful world and addictive gameplay. But the series does start to feel a little bit stale.","https://games.tiscali.cz/recenze/elden-ring-recenze-nejambicioznejsi-souls-hry-529377","Games.cz","gamescz",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":612,"platform":613,"gameTaxonomy":614},{"url":485,"score":388},{"id":516,"name":385},{"game":615,"platform":616},{"id":486,"name":381},{"id":516,"name":385},{"quote":618,"score":506,"url":503,"date":619,"author":503,"authorSlug":18,"image":18,"publicationName":620,"publicationSlug":621,"reviewedProduct":622,"platform":385},"Elden Ring needed to be fresh and bold, and \r\nit succeeds, putting you in charge of your\r\nown adventure. However the open world has \r\nsome uneven terrain. [Issue#12, p.80]","2022-03-07","PLAY","play",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":623,"platform":624,"gameTaxonomy":625},{"url":485,"score":388},{"id":516,"name":385},{"game":626,"platform":627},{"id":486,"name":381},{"id":516,"name":385},[629,636,648,660,672,683,695],{"quote":510,"score":9,"url":503,"date":511,"author":503,"authorSlug":18,"image":18,"publicationName":512,"publicationSlug":513,"reviewedProduct":630,"platform":385},{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":631,"platform":632,"gameTaxonomy":633},{"url":485,"score":388},{"id":516,"name":385},{"game":634,"platform":635},{"id":486,"name":381},{"id":516,"name":385},{"quote":637,"score":9,"url":638,"date":639,"author":503,"authorSlug":18,"image":18,"publicationName":640,"publicationSlug":641,"reviewedProduct":642,"platform":385},"Elden Ring is FromSoftware taming the monster they created, not by filing down its teeth and claws, but by giving players the weapons and armor to endure it.","https://www.slantmagazine.com/games/elden-ring-review/","2022-05-25","Slant Magazine","slant-magazine",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":643,"platform":644,"gameTaxonomy":645},{"url":485,"score":388},{"id":516,"name":385},{"game":646,"platform":647},{"id":486,"name":381},{"id":516,"name":385},{"quote":649,"score":9,"url":650,"date":651,"author":503,"authorSlug":18,"image":18,"publicationName":652,"publicationSlug":653,"reviewedProduct":654,"platform":385},"Elden Ring is a stunning achievement from a literal video game architecture perspective, along with creating a difficult but not wildly punishing game that everyone, even non-Soulsborne devotees, should be able to enjoy. I have not been this impressed with an open world since Skyrim, and Elden Ring even surpasses that in many ways. It\u2019s an easy game to recommend to anyone and everyone, and deserves the explosive sales success we\u2019ve seen, dwarfing old FromSoft records. Elden Ring is a gaming achievement the likes of which we rarely seen, and you will be remiss to not pick it up and see what the hype is about for yourself. ","https://www.forbes.com/sites/paultassi/2022/05/12/elden-ring-review-ps5-game-of-the-generation-so-far/","2022-05-13","Forbes","forbes",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":655,"platform":656,"gameTaxonomy":657},{"url":485,"score":388},{"id":516,"name":385},{"game":658,"platform":659},{"id":486,"name":381},{"id":516,"name":385},{"quote":661,"score":9,"url":662,"date":663,"author":503,"authorSlug":18,"image":18,"publicationName":664,"publicationSlug":665,"reviewedProduct":666,"platform":385},"More than anything, we must always stress that, yes, the Lands Between \u2014 the open world, therefore \u2014 is the main highlight. In an era taken by mediocre open-world games, it's refreshing to see that a company new to this concept got it so precisely right. There's no doubt about it: this is, indeed, one of the best games of recent years. If you're a fan of Open Worlds, no matter what level of challenge you're used to, give it a go. The chances of regret are almost zero. We often think of FromSoftware games in extreme ways. I love it. I hate it. It's amazing. It's unbearable. Elden Ring does bump into these dualities, but tends to be much more attractive to the public in general.","https://www.theenemy.com.br/social/criticas/review-elden-ring","2022-04-18","The Enemy","the-enemy",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":667,"platform":668,"gameTaxonomy":669},{"url":485,"score":388},{"id":516,"name":385},{"game":670,"platform":671},{"id":486,"name":381},{"id":516,"name":385},{"quote":673,"score":9,"url":503,"date":674,"author":503,"authorSlug":18,"image":18,"publicationName":675,"publicationSlug":676,"reviewedProduct":677,"platform":385},"Not for the first time, a Miyazaki game has arrived and the landscape appears transformed. As you play, there is a sense of plates shifting beneath you, of the T&Cs of game development being hastily rewritten. We haven\u2019t felt this way since \u201cBreath of the Wild.\u201d Here, as there, an open world means freedom and fresh air. [Issue#370, p.96]","2022-03-24","Edge Magazine","edge-magazine",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":678,"platform":679,"gameTaxonomy":680},{"url":485,"score":388},{"id":516,"name":385},{"game":681,"platform":682},{"id":486,"name":381},{"id":516,"name":385},{"quote":684,"score":9,"url":685,"date":686,"author":503,"authorSlug":18,"image":18,"publicationName":687,"publicationSlug":688,"reviewedProduct":689,"platform":385},"Whether Elden Ring is perfect is beside the point. What matters is that it\u2019s the ultimate expression of a blueprint first laid out in Dark Souls. It\u2019s made my favorite game of all time feel like a practice run.","https://gamecritics.com/mike-suskie/elden-ring-review/","2022-03-22","GameCritics","gamecritics",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":690,"platform":691,"gameTaxonomy":692},{"url":485,"score":388},{"id":516,"name":385},{"game":693,"platform":694},{"id":486,"name":381},{"id":516,"name":385},{"quote":696,"score":9,"url":697,"date":698,"author":503,"authorSlug":18,"image":18,"publicationName":699,"publicationSlug":700,"reviewedProduct":701,"platform":385},"Elden Ring is a game with a breathtaking universe, with crazy ambition. The effective gameplay coupled with the immense pleasure of exploration that is always rewarded are matched only by the fierce requirements of the game. More accessible than other FS productions, it offers the opportunity to discover a world of crazy elegance, with an artistic direction that is quite simply masterful. A generous world we no longer want to leave. An absolute masterpiece.\r\n","http://carolequintaine.com/?p=48280&preview=true","2022-03-18","Carole Quintaine","carole-quintaine",{"id":486,"type":514,"title":381,"url":515,"criticScoreSummary":702,"platform":703,"gameTaxonomy":704},{"url":485,"score":388},{"id":516,"name":385},{"game":705,"platform":706},{"id":486,"name":381},{"id":516,"name":385},[],[],{"self":710,"tabs":712},{"href":711},"https://backend.metacritic.com/reviews/metacritic/critic/games/elden-ring/summary/web?componentName=critic-reviews&componentDisplayName=Critic+Reviews&componentType=ProductReviewsSummary",[713,714,715,716],{"label":517,"href":503},{"label":518,"href":503},{"label":519,"href":503},{"label":520,"href":503},{"componentName":718,"componentDisplayName":719,"componentType":720},"critic-reviews","Critic Reviews","ProductReviewsSummary",{"data":722,"links":729,"meta":732},{"item":723},{"id":521,"max":507,"score":504,"reviewCount":724,"positiveCount":725,"neutralCount":726,"negativeCount":727,"sentiment":508,"url":728},24262,19864,1567,2831,"/game/elden-ring/user-reviews/?platform=playstation-5",{"self":730},{"href":731},"https://backend.metacritic.com/reviews/metacritic/user/games/elden-ring/stats/web?componentName=user-score-summary&componentDisplayName=User+Score+Summary&componentType=MetaScoreSummary",{"componentName":733,"componentDisplayName":734,"componentType":547},"user-score-summary","User Score Summary",{"data":736,"links":1053,"meta":1061},{"id":521,"totalResults":522,"item":737},{"default":738,"positive":815,"negative":891,"neutral":972},[739,747,755,763,776,789,802],{"id":523,"quote":524,"score":507,"thumbsUp":18,"thumbsDown":18,"date":525,"author":526,"version":527,"spoiler":15,"reviewedProduct":740,"platform":385},{"id":486,"type":514,"title":381,"url":515,"platform":741,"gameTaxonomy":742},{"id":483,"name":385},{"family":743,"title":744,"game":7 sUp":18,"thumbsDown":18,"date":856,"author":911,"version":912,"spoiler":15,"reviewedProduct":913,"platform":385},"6534a7b0-0e79-4566-b79c-d21980cde7f0","The game is graphically gorgeous. I often found myself traversing the world just to see what was around the bend. That's kind of where my enjoyment ended though. I wasn't allowed to delight in leveling up, defeating bosses, or creating a great character build. **** game is far too punishing. The enemies in between destinations are spread out enough to be fun and challenging, and if you die, we'll it is easy enough to get back there to collect your dropped runes. But if you die in a location such as ruins, fortress or a cave/dungeon, the enemies are often overwhelming enough to take you down. Then you have to make it all the way back to where you bit the dust tore claim you dropped runes. Yes, you gotta walk back into the same hell hole that killed you **** what you lost the first time and it often kills you again causing you to lose your hard earned runes permanently. The controls are sluggish and the camera often is not dynamic enough to help you see your way out of trouble. The final nail in the coffin is the story, or lack thereof. There is not enough of it to grasp on to and make me understand why Im doing what Im doing, wandering around the vast, beautiful open world, or even really care. Your character is bland,the circumstances vague, and you wander aimlessly.\n\nThere are those this game was meant for. I was not one of them.","matthall3791",1749364681252,{"id":486,"type":514,"title":381,"url":515,"platform":914,"gameTaxonomy":915},{"id":483,"name":385},{"family":916,"title":917,"game":918,"platform":919},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":921,"quote":922,"score":12,"thumbsUp":18,"thumbsDown":18,"date":923,"author":924,"version":925,"spoiler":15,"reviewedProduct":926,"platform":385},"e1ca4bea-ad2c-45e9-9895-a59c16048b0c","They should've gotten the actual FromSoftware to make this game. Cause no way did the people who made the bosses in DS3 and Bloodborne make the pieces of **** in this one.","2025-06-06","Zeeboomer02",1749171498345,{"id":486,"type":514,"title":381,"url":515,"platform":927,"gameTaxonomy":928},{"id":483,"name":385},{"family":929,"title":930,"game":931,"platform":932},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":934,"quote":935,"score":12,"thumbsUp":18,"thumbsDown":18,"date":936,"author":937,"version":938,"spoiler":15,"reviewedProduct":939,"platform":385},"6a6f8e3a-4130-4577-ba5a-9af94b08e10d","It's great and it ****. Inconsistent difficulty is the biggest problem. Some areas are a blast - a challenge and lots of fun. Other areas are literally impossible to pass because of the extreme difficulty. It has a lot of content, but you'll be highly frustrated trying to experience much of it.","2025-05-14","multiwalrus",1747244350232,{"id":486,"type":514,"title":381,"url":515,"platform":940,"gameTaxonomy":941},{"id":483,"name":385},{"family":942,"title":943,"game":944,"platform":945},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":947,"quote":948,"score":12,"thumbsUp":18,"thumbsDown":18,"date":949,"author":950,"version":951,"spoiler":15,"reviewedProduct":952,"platform":385},"96f0c91d-4102-4d39-bb1f-e0e86c7c049b","Overrated game that did so much wrong what made Dark Souls so good. Hyper aggressive bosses with endless combos and huge areas with nothing useful in it make no fun. PvP is boring in this game and no fun at all","2025-04-12","DannyDurak",1744446858298,{"id":486,"type":514,"title":381,"url":515,"platform":953,"gameTaxonomy":954},{"id":483,"name":385},{"family":955,"title":956,"game":957,"platform":958},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":960,"quote":961,"score":12,"thumbsUp":18,"thumbsDown":18,"date":962,"author":963,"version":964,"spoiler":15,"reviewedProduct":965,"platform":385},"23b23d49-2ccb-4eb0-ad80-016ec414d875","After 156 hours I must conclude that the souls fomular doesnt work on an open world. They is so much quantity in this game without quality. Bosses like Margit, Radahn or Mogh are peak bosses but they an absolute minority. All dragon bosses are bad in Elden Ring. They are sadly all bad designed and balanced. They have cool over the top attacks but gameplay wise all the same. 90% of the bosses are reused and boring. The dodge and hit mechanic are its limit got sadly boring in the end.\nThere is no variety every weapon plays almost the same and armor is useless. Its my opinion but the passive playstyle where you always is sometimes  even frustrating and boring. The dodge timing is now so thight that its almost impossible to create fair **** the parry mechanic in Sekiro is waymore satisfying. Imagine playing against Consort Radahn or Fortissax but with parrys and mikiri counters etc. This would be mind blowing. It becomes a battle between two power houses and not just a battle where you try to avoid the battle. Another big malus is the loot. In the first area. Its fun gathering loot. But midgame the loot is 99% useless because of your build and a waste if time. So you stop looting. But the openworld has only battles, loot or mini quest (conversations). Therefore you stop exploring and start to rush the game. \nIn the end its clear that most of the good reviews are written by Soulsfanatics. At least the dlc was able to fix the mistakes of the maingame !","2025-03-21","Bigspin",1742564799884,{"id":486,"type":514,"title":381,"url":515,"platform":966,"gameTaxonomy":967},{"id":483,"name":385},{"family":968,"title":969,"game":970,"platform":971},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},[973,981,989,1002,1015,1028,1041],{"id":764,"quote":765,"score":13,"thumbsUp":18,"thumbsDown":18,"date":766,"author":767,"version":768,"spoiler":15,"reviewedProduct":974,"platform":385},{"id":486,"type":514,"title":381,"url":515,"platform":975,"gameTaxonomy":976},{"id":483,"name":385},{"family":977,"title":978,"game":979,"platform":980},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":777,"quote":778,"score":13,"thumbsUp":18,"thumbsDown":18,"date":779,"author":780,"version":781,"spoiler":15,"reviewedProduct":982,"platform":385},{"id":486,"type":514,"title":381,"url":515,"platform":983,"gameTaxonomy":984},{"id":483,"name":385},{"family":985,"title":986,"game":987,"platform":988},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":990,"quote":991,"score":13,"thumbsUp":18,"thumbsDown":18,"date":992,"author":993,"version":994,"spoiler":15,"reviewedProduct":995,"platform":385},"f9b382b0-7980-4fa6-9ac6-0c2a03376ffc","Insane art direction, incredible sound design and phenomenal atmosphere. \n\nHowever, I hate how bosses and most enemies have crazy combos that never end and never give you a second to hit back. Also, I don't think a simple encounter in the wilds should feel as difficult as an endgame boss from earlier Souls games.\n\nI don't like the open-world structure. Most of your time is spent riding your horse and wasting time trying to find something to do that doesn't involve just killing everything you see.\n\nQuests are impossible to follow or complete without using the wiki. If you don't, you will either completely miss the next objective or randomly stumble on the NPC like 50 hours later and now they're dead.\n\nAnother thing. In previous Souls games, items and gear were found naturally through exploring all nooks and crannies. There doesn't seem to be as much stuff in the environment to find this time around, I'm never rewarded for going out of my way to explore, unless you count rewards from completing dungeons... which, most of the time, end up useless to you because of stats requirements. This creates a frustrating gameplay loop where you work your butt off to clear a difficult boss only to get a reward you won't even use. This happens over and over again unless you use a wiki to plan out your build and route but that defeats the whole point of exploration.\n\nFinally, I think the game takes too long to beat. I prefer the previous Souls games that are more focused and intentional. Elden Ring feels bloated.","2026-05-28","MisteurFox",1779961697807,{"id":486,"type":514,"title":381,"url":515,"platform":996,"gameTaxonomy":997},{"id":483,"name":385},{"family":998,"title":999,"game":1000,"platform":1001},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":1003,"quote":1004,"score":13,"thumbsUp":18,"thumbsDown":18,"date":1005,"author":1006,"version":1007,"spoiler":15,"reviewedProduct":1008,"platform":385},"288159a7-6d6c-468a-b035-18e1fb29a73a","I have a love hate relationship with Elden Ring. It has some of the coolest weapons/builds in all Fromsoft history and NG+7 is actually doable and fun to play through, but that's where the positives end. Open world games are overwhelming nowadays for someone who likes to complete games. Waaaay too many copy pasted dungeons with copy pasted bosses. There's too many crannies to search and vast open areas with nothing of note. When you do find an item hidden out in the open world, 9 times out of 10 it's a leaf or a mushroom. You are not rewarded nearly enough for going down optional paths and that's a problem for a game as big as Elden Ring. The bosses are more aggressive than ever before and there needs to be a line. Bosses have these seemingly endless combos with lots of forward momentum. You'll get a VERY small window of opportunity to hit the boss like once or twice, then it's back to these ridiculously long combos. You barely get to attack, it's just roll city and if you get caught, a third or more of your HP is gone. And my last complaint is that this game is waaaaay too long for a souls game. Part of the fun of these games is that the run time is long enough to be significant but short enough to where you want to go through it again with a new weapon/build. In Elden Ring I was exhausted by the time the credits rolled and I didn't want to try out any cool new builds. Such a shame. ","2026-05-18","Ansemriku10",1779730066336,{"id":486,"type":514,"title":381,"url":515,"platform":1009,"gameTaxonomy":1010},{"id":483,"name":385},{"family":1011,"title":1012,"game":1013,"platform":1014},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":1016,"quote":1017,"score":13,"thumbsUp":18,"thumbsDown":18,"date":1018,"author":1019,"version":1020,"spoiler":15,"reviewedProduct":1021,"platform":385},"0109fe51-b6d5-4086-88c1-1385a97f487b","Excellent mais le je ne nous donne pas envie d'explorer a cause de sa difficult\u00e9 ","2026-02-07","gami667",1774118419460,{"id":486,"type":514,"title":381,"url":515,"platform":1022,"gameTaxonomy":1023},{"id":483,"name":385},{"family":1024,"title":1025,"game":1026,"platform":1027},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":1029,"quote":1030,"score":13,"thumbsUp":18,"thumbsDown":18,"date":1031,"author":1032,"version":1033,"spoiler":15,"reviewedProduct":1034,"platform":385},"56d7638b-3cbe-44e5-8b8e-7f0e215f4008","It\u2019s good but doesn\u2019t really deserve the high scores people are giving it. There\u2019s a lot of copy and paste in the game. Both from a level point of view and bosses. Making the same boss a different colour isn\u2019t a new boss. You fight the same ones over and over again. It\u2019s just lazy","2026-03-04","Shadow757",1772591874781,{"id":486,"type":514,"title":381,"url":515,"platform":1035,"gameTaxonomy":1036},{"id":483,"name":385},{"family":1037,"title":1038,"game":1039,"platform":1040},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"id":1042,"quote":1043,"score":13,"thumbsUp":18,"thumbsDown":18,"date":509,"author":1044,"version":1045,"spoiler":15,"reviewedProduct":1046,"platform":385},"f99b653c-9caa-46af-8dcb-c9a10f4b3993","Personally, I don't think the open world works - it feels unnecessary and adds a lot of padding to the game. Also, the discount chalice dungeons aren't my favourite side activity, and I don't think offers enough to be worth exploring. Furthermore, I'm not a fan of recycling bosses or just duplicating bosses to make the fight harder (lazy game design). With that being said, it's not my least favourite Soulsborne game. It's still pretty good, just not great.","Blitzbjorn",1770800208013,{"id":486,"type":514,"title":381,"url":515,"platform":1047,"gameTaxonomy":1048},{"id":483,"name":385},{"family":1049,"title":1050,"game":1051,"platform":1052},{"id":493,"name":381},{"id":378,"name":381},{"id":486,"name":381},{"id":483,"name":385},{"self":1054,"tabs":1056},{"href":1055},"https://backend.metacritic.com/reviews/metacritic/user/games/elden-ring/summary/web?componentName=user-reviews&componentDisplayName=User+Reviews&componentType=ProductReviewsSummary",[1057,1058,1059,1060],{"label":517,"href":503},{"label":518,"href":503},{"label":519,"href":503},{"label":520,"href":503},{"componentName":1062,"componentDisplayName":1063,"componentType":720},"user-reviews","User Reviews",{"edition":17,"title":1065,"id":1066,"slug":382,"category":18,"description":384,"pageType":501,"section":385,"image":18,"typeName":379,"franchises":1067,"platforms":1068,"genres":1069,"publishers":1070,"game":381,"score":1071},"Elden Ring Reviews","1300501979",[381],[450,457,468,475,385],[438],[399,404,399],"96",["Reactive",1073],{"$si18n:cached-locale-configs":1074,"$si18n:resolved-locale":503,"$sserver-time:fetched-at":4,"$stoasts":1077,"$smodal:auth:isOpen":15,"$smodal:review:isOpen":15,"$smodal:reviewReadMore:isOpen":15,"$smodal:reviewReadMore:review":18,"$smodal:reviewReadMore:reviewType":18,"$smodal:reviewReadMore:isGameCategory":15,"$smodal:report:isOpen":15,"$smodal:report:review":18},{"en":10
