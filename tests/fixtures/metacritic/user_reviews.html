prises partout. Le jeu de la d\u00e9cennie sans h\u00e9siter","2026-04-26","Gojiiira",1777193391922,{"id":480,"type":532,"title":381,"url":533,"platform":625,"gameTaxonomy":626},{"id":474,"name":475},{"family":627,"title":628,"game":629,"platform":630},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":632,"quote":633,"score":507,"thumbsUp":18,"thumbsDown":18,"date":634,"author":635,"version":636,"spoiler":15,"reviewedProduct":637,"platform":475},"1eefe49a-9b63-4ba1-9d83-aaaee98d1ca8","SEMPLICEMENTE UN 10/10 \nGIOCATO PER BEN 35 VOLTE...BASTA QUESTO A DESCRIVERLO.","2026-04-10","JustFenix",1775811584837,{"id":480,"type":532,"title":381,"url":533,"platform":638,"gameTaxonomy":639},{"id":474,"name":475},{"family":640,"title":641,"game":642,"platform":643},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":645,"quote":646,"score":507,"thumbsUp":18,"thumbsDown":18,"date":647,"author":648,"version":649,"spoiler":15,"reviewedProduct":650,"platform":475},"631f57f9-ebb8-49a4-bee9-9bdb83b15d72","Este juego consigui\u00f3 enamorarme de los souls, gener\u00f3 que hab\u00eda rechazado en el pasado. Lo comenc\u00e9 en xbox one y lo termin\u00e9 en xbox series x, fue en la transici\u00f3n de consolas que tuve, por lo tanto tambi\u00e9n tiene ese valor sentimental.\nEl juego es maravilloso por todos lados. Sus paisajes y distintos escenarios, cada uno con su tem\u00e1tica, son impresionantes, inmersivos e inmensos. Cada lugar que me gustaba le sacaba una captura, se ve\u00edan muy \u00e9picas. Tambi\u00e9n el dise\u00f1o art\u00edstico de distintos jefes eran imponentes y \u00e9picos.\nSu sistema de pelea, que son un verdadero reto. Sus armas, las armaduras, las invocaciones, las magias, etc te dan mucha versatilidad para armarte todo tipo de builds. El dise\u00f1o de todos estos aspectos que acabo de nombrar tambi\u00e9n eran bell\u00edsimos.\nSus personajes muy entra\u00f1ables, imponentes, sus historias se te quedan grabadas en la mente. La historia principal muy \u00e9pica.\nSu dlc tambi\u00e9n fue un acierto total, los jefes nuevos, sus zonas nuevas, la historia, su sistema para mejorar el personaje, todo un acierto.\nEste juego me encant\u00f3, me hizo probar y enamorarme de un g\u00e9nero nuevo como son los soulslike, adem\u00e1s te da un muy buen manejo ante la frustraci\u00f3n y la persistencia.","2026-03-27","Maty2024",1774603119372,{"id":480,"type":532,"title":381,"url":533,"platform":651,"gameTaxonomy":652},{"id":474,"name":475},{"family":653,"title":654,"game":655,"platform":656},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":658,"quote":659,"score":507,"thumbsUp":18,"thumbsDown":18,"date":660,"author":661,"version":662,"spoiler":15,"reviewedProduct":663,"platform":475},"1492818f-043e-4525-a998-bdecda6879e5","Elden Ring is an incredible open-world RPG with amazing exploration, challenging combat, and a deep mysterious world. The freedom to explore and discover secrets makes every moment exciting and rewarding","2026-03-09","t4ac",1773094936898,{"id":480,"type":532,"title":381,"url":533,"platform":664,"gameTaxonomy":665},{"id":474,"name":475},{"family":666,"title":667,"game":668,"platform":669},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":671,"quote":672,"score":507,"thumbsUp":18,"thumbsDown":18,"date":673,"author":674,"version":675,"spoiler":15,"reviewedProduct":676,"platform":475},"b329fbfa-d57e-4092-9e9c-284145902aaa","Elden Ring foi meu primeiro souls like, sempre assisti e sonhava em jogar, quando comprei meu primeiro console eu amei poder desfrutar de tal jogo, melhor jogo da minha vida","2026-02-07","SanKratos",1770502039171,{"id":480,"type":532,"title":381,"url":533,"platform":677,"gameTaxonomy":678},{"id":474,"name":475},{"family":679,"title":680,"game":681,"platform":682},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":684,"quote":685,"score":13,"thumbsUp":18,"thumbsDown":18,"date":686,"author":687,"version":688,"spoiler":15,"reviewedProduct":689,"platform":475},"c70bdd6d-2b33-4ab2-997b-f4f9122143b2","What can I say about Elden Ring that hasn\u2019t already been said? Honestly, nothing. It\u2019s a masterpiece and you absolutely have to play it if you meet two conditions:\t\n- You have time to play\t\n- You like difficult games\n\nThat\u2019s it. If you fit this profile, play it. Period.\n\nNow I want to expand a bit on a couple of things:\n\nFirst, something negative: maybe the game is too big or repetitive,  I\u2019m not entirely sure what to think, but personally, once I was well into the game, when I finished an area (thoroughly explored), it could feel a bit tiring to start a new one, knowing all the effort it would take to complete it.\n\nThe other point is a recommendation: try to get a bit into the story/lore\u2014not by using guides, but by trying to piece things together yourself (at least to a certain extent).\n\nAnd finally, once again: don\u2019t overthink it\u2014just play it.","2026-02-01","Alen213",1769970643763,{"id":480,"type":532,"title":381,"url":533,"platform":690,"gameTaxonomy":691},{"id":474,"name":475},{"family":692,"title":693,"game":694,"platform":695},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":697,"quote":698,"score":10,"thumbsUp":18,"thumbsDown":18,"date":686,"author":699,"version":700,"spoiler":15,"reviewedProduct":701,"platform":475},"31215e19-b5c0-4182-9e29-95d4b689f4b0","Needs the seemless co-op mod added officially to really be enjoyed. The open world is empty and just adds wasted hours to play time. Wanted to enjoy this game but on PC with mods is really the only way to make it work. Like myself if you were looking forward to a Darksouls game with Rockstar level worlds you won't get it here. Outward does what elden ring tries but better.","Killswitch77",1769966941586,{"id": 4},{"id":474,"name":475},{"family":925,"title":926,"game":927,"platform":928},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":930,"quote":931,"score":11,"thumbsUp":18,"thumbsDown":18,"date":932,"author":933,"version":934,"spoiler":15,"reviewedProduct":935,"platform":475},"8f1842b5-385e-4d05-b1a7-71b16380e806","Gameplay very good, I wish they had a in game story which you didn\u2019t have to look for on YouTube for it to make sense.","2025-06-08","P4PA",1749372272836,{"id":480,"type":532,"title":381,"url":533,"platform":936,"gameTaxonomy":937},{"id":474,"name":475},{"family":938,"title":939,"game":940,"platform":941},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":943,"quote":944,"score":507,"thumbsUp":18,"thumbsDown":18,"date":945,"author":946,"version":947,"spoiler":15,"reviewedProduct":948,"platform":475},"ea925289-68e8-4a55-ab67-99227a90f78f","---\n\nOwning Ring \u2013 A Brilliantly Flawed Epic of Ambition and Identity\n\nBy Mait (Guest Critic, RPG Realms)\n\nWhen a game dares to evoke echoes of classics like Elden Ring, Dark Souls, and Divinity: Original Sin, the expectations it must meet are sky-high. Owning Ring, the latest title from indie powerhouse Sable Fable Studios, enters the arena clad in ambition and swagger, a narrative-heavy RPG that explores themes of dominion, memory, and the burden of legacy. But does this sprawling saga actually wear its \u201cring\u201d with authority, or is it simply trying it on for size?\n\nThe answer is not straightforward. Owning Ring is a game of startling brilliance and staggering missteps. It's a paradox wrapped in sublime world-building and uneven gameplay. Yet, for all its flaws, it is one of the most daring and complex RPGs released this year\u2014one that demands conversation, confrontation, and contemplation.\n\n\n---\n\nPremise: A World Already Owned\n\nThe central conceit of Owning Ring is both metaphorical and literal. You play as a \u201cBearer,\u201d an unwilling inheritor of an ancient, metaphysical artifact\u2014the titular Owning Ring\u2014that binds dominion over fragments of reality itself. But there\u2019s a catch: every time you use the Ring\u2019s power to control the world around you, your memories fade. Your victories come at the cost of identity, truth, and ultimately, selfhood.\n\nThis mechanic is elegantly woven into the narrative. The game begins with your character awakening in the ruins of the Ember Crown\u2014an ancient seat of power\u2014lacking any memory of how they got there. NPCs recognize you with mixed feelings: some with awe, others with fear, and a few with naked hatred. You are a legend before you even press a button, and the tension of reclaiming or rewriting that legacy fuels the emotional thrust of the game.\n\nThe writing is stellar\u2014dense without being bloated, poetic without becoming purple. Dialogues are tinged with mystery and double meanings, and the world\u2019s history unfolds in nonlinear, player-directed fashion, reminiscent of the best moments in Planescape: Torment. The game trusts you to piece together who you are\u2014and who you were\u2014from shards of lore, unreliable narrators, and the lingering consequences of your past decisions.\n\n\n---\n\nGameplay: The Burden of Power\n\nMechanically, Owning Ring is a complex, turn-based tactical RPG hybrid with real-time overworld exploration. Think XCOM meets Dragon Age, with a heavy infusion of Disco Elysium\u2019s narrative branches. The Owning Ring gives players the ability to alter battlefield conditions\u2014rerouting rivers, summoning walls from the earth, or possessing enemies mid-fight\u2014but each use consumes not mana or stamina, but memory. This unique \u201cAmnesia\u201d mechanic is both a blessing and a curse.\n\nAt first, it feels invigorating. In your first major battle, choosing to overwrite the terrain with obsidian pillars to funnel enemy archers into your ambush feels brilliant. But then, post-battle, your character no longer remembers the names of two party members. Their dialogue changes. The relationship dynamics shift. It's one of the few games where power is genuinely frightening\u2014not because of the foes you face, but the erosion of your own foundations.\n\nThis system encourages conservative play, a rarity in modern RPGs. You find yourself asking, \u201cDo I really need to use the Ring here?\u201d\u2014and often, the answer is no. But when you do decide to rewrite reality, the payoff is massive, both tactically and narratively.\n\nHowever, the mechanic does stumble. Memory loss is at times too punishing or too inconsistent. Some forgotten lore can be regained through dream sequences or side quests, while other losses are permanent\u2014and the game isn\u2019t always clear about which is which. Worse, some core progression hinges on optional memory branches, creating potential soft-lock scenarios where players unintentionally erase their ability to continue certain questlines. It\u2019s a bold gamble, but one that needed slightly more polish and better signposting.\n\n\n---\n\nCombat and Party Dynamics\n\nCombat is rich and deep, offering a variety of tactical builds and team synergies. Each companion\u2014of which there are thirteen\u2014has a unique \u201cEcho Trait\u201d linked to your past decisions. For example, if you spared the Mad Bishop during a flashback in the Ebon Library, your scholar companion Zephira gains a faith-based counterattack. If you executed him, she instead develops a nihilistic debuff aura. These micro-adjustments create a sense that every choice shapes not only the story but your party's mechanical identity.\n\nThat said, the balancing can feel off. Some late-game battles are mind-numbingly easy if you\u2019ve invested in Echo Traits that synergize, while othe","2025-06-01","Tyrannnnn",1748765698240,{"id":480,"type":532,"title":381,"url":533,"platform":949,"gameTaxonomy":950},{"id":474,"name":475},{"family":951,"title":952,"game":953,"platform":954},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":956,"quote":957,"score":13,"thumbsUp":18,"thumbsDown":18,"date":958,"author":959,"version":960,"spoiler":15,"reviewedProduct":961,"platform":475},"fca8cf05-a5f9-4536-8733-c0204fc4ee51","I put this game down 2 times.  In fact I purchased it and refunded it those times because the noise from positive reviews kept telling me to try again.  I guess 3rd times a charm as this game's challenging system was actually just as rewarding.  It's absolutely the most difficult game I've ever had to play in my 30 years of gaming, but also easily the most rewarding.  Never have I cheered, such as when I defeated Milania.  The game is about learning, learning your own paths to defeat the difficult parts of the whole game.  In doing so, you unlock a journey that is rewarding.  I took away a single point because for me, when the game is won, I do NOT want to force myself through that again.  Elsewise, a gaming must.","2025-05-20","metadadda",1747764553879,{"id":480,"type":532,"title":381,"url":533,"platform":962,"gameTaxonomy":963},{"id":474,"name":475},{"family":964,"title":965,"game":966,"platform":967},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":969,"quote":970,"score":13,"thumbsUp":18,"thumbsDown":18,"date":971,"author":972,"version":973,"spoiler":15,"reviewedProduct":974,"platform":475},"903b5bdf-53d1-4751-b53c-52d27d732d7a","A production that truly deserves the game of the year award.Open world, enemies, bosses, area designs are perfect. I would like to see more games like this.","2025-05-13","Achilleas14",1747161100056,{"id":480,"type":532,"title":381,"url":533,"platform":975,"gameTaxonomy":976},{"id":474,"name":475},{"family":977,"title":978,"game":979,"platform":980},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":982,"quote":983,"scor ftware's absolute masterpiece and one of the most beautiful games of all time. It marked me.","2024-12-11","AlexBiGr",1733881306569,{"id":480,"type":532,"title":381,"url":533,"platform":1078,"gameTaxonomy":1079},{"id":474,"name":475},{"family":1080,"title":1081,"game":1082,"platform":1083},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":1085,"quote":1086,"score":507,"thumbsUp":18,"thumbsDown":18,"date":1087,"author":1088,"version":1089,"spoiler":15,"reviewedProduct":1090,"platform":475},"26fb8b57-7943-4c31-a7d1-a912fd77d3b9","Elden Ring es simplemente espectacular. El mundo abierto es enorme y est\u00e1 lleno de sorpresas; siempre hay algo que descubrir. El combate es dif\u00edcil, pero justo, y cada victoria se siente incre\u00edble. Me encant\u00f3 la libertad que tienes para explorar y enfrentar los desaf\u00edos a tu manera. Adem\u00e1s, el dise\u00f1o art\u00edstico es precioso, con paisajes y criaturas que te dejan con la boca abierta. Es un juego que realmente eleva el est\u00e1ndar de los RPG.","2024-11-27","Brxkencxs",1732699640046,{"id":480,"type":532,"title":381,"url":533,"platform":1091,"gameTaxonomy":1092},{"id":474,"name":475},{"family":1093,"title":1094,"game":1095,"platform":1096},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":1098,"quote":1099,"score":14,"thumbsUp":18,"thumbsDown":18,"date":1100,"author":1101,"version":1102,"spoiler":15,"reviewedProduct":1103,"platform":475},"f732debd-e47d-4a4b-b8f3-a60155381339","Almost perfect game ever.\nOnly negative aspect is imbalance skill-based-match-making in duels. Dlc and base game players fight in the same arena. Very bad sbmm, because Dlc has very high damage talismans and weapons comparing to base game.","2024-11-24","uzbeksniper",1732483851006,{"id":480,"type":532,"title":381,"url":533,"platform":1104,"gameTaxonomy":1105},{"id":474,"name":475},{"family":1106,"title":1107,"game":1108,"platform":1109},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":1111,"quote":1112,"score":13,"thumbsUp":18,"thumbsDown":18,"date":1113,"author":1114,"version":1115,"spoiler":15,"reviewedProduct":1116,"platform":475},"a5c6c911-c3df-4892-902c-e9c3da39123d","The game doesn't earn a 10 due to its lackluster co-op multiplayer. The most fun I had was battling tough foes in a dreamlike world with my friend. It's amusing to watch streamers struggle after you've beaten it.","2024-11-20","8eelol",1732129825589,{"id":480,"type":532,"title":381,"url":533,"platform":1117,"gameTaxonomy":1118},{"id":474,"name":475},{"family":1119,"title":1120,"game":1121,"platform":1122},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":1124,"quote":1125,"score":16,"thumbsUp":18,"thumbsDown":18,"date":1126,"author":1127,"version":1128,"spoiler":15,"reviewedProduct":1129,"platform":475},"2bca35d4-7252-4c7d-9f25-a064188a956a","Franchement un jeu sans saveur,qualit\u00e9 m\u00e9diocre une honte pour un jeu next gen, doublage fran\u00e7ais inexistant merci pour les fran\u00e7ais. Les combats sont assez lents, punition injustifi\u00e9 , un jeu fait pour des personnes qui ne travaillent pas. J'esp\u00e8re que ce genre de jeu va arr\u00eater \u00e0 l'avenir. Prenez exemple sur assassin's creed valhalla, odyss\u00e9e, mass effect etc","2024-11-09","EnigmaB33",1731173764384,{"id":480,"type":532,"title":381,"url":533,"platform":1130,"gameTaxonomy":1131},{"id":474,"name":475},{"family":1132,"title":1133,"game":1134,"platform":1135},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":1137,"quote":1138,"score":507,"thumbsUp":18,"thumbsDown":18,"date":1139,"author":1140,"version":1141,"spoiler":15,"reviewedProduct":1142,"platform":475},"44812375-b19a-4f5d-a280-858c675665d6","Must play game, i spend 4 days to complete but i still need to explore so much more.","2024-11-03","krissa582",1730628784359,{"id":480,"type":532,"title":381,"url":533,"platform":1143,"gameTaxonomy":1144},{"id":474,"name":475},{"family":1145,"title":1146,"game":1147,"platform":1148},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":1150,"quote":1151,"score":507,"thumbsUp":18,"thumbsDown":18,"date":1152,"author":1153,"version":1154,"spoiler":15,"reviewedProduct":1155,"platform":475},"145f0d3d-f118-4ad9-8254-bca28e0128b0","Elden Ring will still be talked about 30 - 40 years after its 2022 release date. And for good reasons, this is the perfect game. Challenging gameplay, breath-taking scenery,  huge world to explore and full of lore. And on top of all the insane amount of content in the base game, the expansion is added to the buffet. 10/10 . Do yourself a favor and buy this game if you haven't already.","2024-10-05","AegisLangleyVII",1728159371772,{"id":480,"type":532,"title":381,"url":533,"platform":1156,"gameTaxonomy":1157},{"id":474,"name":475},{"family":1158,"title":1159,"game":1160,"platform":1161},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"id":1163,"quote":1164,"score":507,"thumbsUp":18,"thumbsDown":18,"date":1165,"author":1166,"version":1167,"spoiler":15,"reviewedProduct":1168,"platform":475},"a04baddf-6737-4eb2-8b60-314cc36a9362","I have never played a game this good. This was the first souls game I played, and this has successfully made me fall in love with the genre. I cannot make any comments on the graphics because I was playing on a lower-end television, but I can comment on the boss design. Most of the bosses are incredible. Just incredibly well made fights, with the exception of a few, like Regal Ancestral Spirit. RAS was just simply not made for melee, which is the play style I always take up. I haven't ever completely a magic-only run, but from what I have heard magic is extremely fun to play. I just simply prefer the difficulty that comes with melee. Melee combat feels really, really good, although it does not flow as well as Sekiro: Shadows Die Twice. The majority of the weapons in the game are extremely well made and have some purpose. Bows and crossbows are pretty much entirely pointless, though. I have pretty much no complaints with the game, other than it not being cross-platform. I think if the game was cross-platform I'd only enjoy it more. I suppose the game could also benefit from Seamless Co-op being a vanilla feature, but other than that the game is flawless.","2024-09-27","undercatt",1727469542367,{"id":480,"type":532,"title":381,"url":533,"platform":1169,"gameTaxonomy":1170},{"id":474,"name":475},{"family":1171,"title":1172,"game":1173,"platform":1174},{"id":493,"name":381},{"id":378,"name":381},{"id":480,"name":381},{"id":474,"name":475},{"self":1176,"prev":1178,"next":1179,"first":1181,"last":1182,"filterOptions":1184,"sortOptions":1200},{"href":1177},"https://backend.metacritic.com/reviews/metacritic/user/games/elden-ring/platform/xbox-series-x/web?offset=0&limit=50&filterBySentiment=all&sort=date&componentName=user-reviews&componentDisplayName=user+Reviews&componentType=ReviewList",{"href":18},{"href":1180},"https://backend.metacritic.com/reviews/metacritic/user/games/elden-ring/platform/xbox-series-x/web?offset=50&limit=50&filterBySentiment=all&sort=date&componentName=user-reviews&componentDisplayName=user+Reviews&componentType=ReviewList",{"href":1177},{"href":1183},"https://backend.metacritic.com/reviews/metacritic/user/games/elden-ring/platform/xbox-series-x/web?offset=1150&limit=50&filterBySentiment=all&sort=date&componentName=user-reviews&componentDisplayName=user+Reviews&componentType=ReviewList",[1185,1188,1192,1196],{"label":1186,"value":1187,"href":1177},"All Reviews","all",{"label":1189,"value":1190,"href":1191},"Positive Reviews","positive","https://backend.metacritic.com/reviews/metacritic/user/games/elden-ring/platform/xbox-series-x/web?offset=0&limit=50&filterBySentiment=positive&sort=date&componentName=user-reviews&comp
